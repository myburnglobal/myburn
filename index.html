<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>myburn.global</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #1a1a1a;
      --accent-color: #ff4500;
      --text-color: #f0f0f0;
      --muted-text: #888888;
      --border-color: #333333;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 800px;
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.5rem;
      letter-spacing: -1px;
      margin-bottom: 5px;
    }

    .sub-heading {
      color: var(--muted-text);
      font-size: 0.95rem;
    }

    main {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
    }

    .date-selector {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .date-btn {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .date-btn.active, .date-btn:hover {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
    }

    .embed-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 6px;
      background-color: #000;
      margin-bottom: 15px;
    }

    .embed-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .burn-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .like-btn {
      background: none;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
    }

    .like-btn:hover {
      background-color: var(--accent-color);
      color: #fff;
    }

    .comment-section {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .comment-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .submit-btn {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 300px;
      overflow-y: auto;
    }

    .comment-item {
      background-color: rgba(255, 255, 255, 0.03);
      padding: 10px;
      border-radius: 4px;
      border-left: 3px solid var(--accent-color);
    }

    .comment-author {
      font-weight: bold;
      font-size: 0.85rem;
      color: var(--muted-text);
      margin-bottom: 4px;
    }

    .comment-body {
      font-size: 0.95rem;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <header>
    <h1>myburn.global</h1>
    <div class="sub-heading">daily curated mixtapes & soundscapes</div>
  </header>

  <main>
    <section class="card">
      <div id="date-nav" class="date-selector">
        <!-- Date buttons dynamically populated -->
      </div>

      <div id="player-container" class="embed-container">
        <!-- Spotify/Audio Embed loaded here -->
      </div>

      <div class="burn-meta">
        <div>
          <h2 id="burn-title" style="margin: 0; font-size: 1.2rem;">Loading...</h2>
          <span id="burn-curator" class="sub-heading">--</span>
        </div>
        <button id="like-button" class="like-btn" onclick="submitLike()">
          🔥 <span id="like-count">0</span>
        </button>
      </div>
    </section>

    <section class="card comment-section">
      <h3>Discussion</h3>
      
      <form class="comment-form" onsubmit="submitComment(event)">
        <div class="form-row">
          <input type="text" id="comment-name" placeholder="Handle" style="width: 30%;" maxlength="30" required>
          <input type="text" id="comment-text" placeholder="Drop a thought on this burn..." style="width: 70%;" maxlength="300" required>
        </div>
        <button type="submit" id="submit-btn" class="submit-btn">Post Comment</button>
      </form>

      <div id="comment-list" class="comment-list">
        <!-- Comments dynamically rendered -->
      </div>
    </section>
  </main>

  <script>
    // -------------------------------------------------------------
    // REPLACE THIS WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
    // -------------------------------------------------------------
    const GOOGLE_APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzBiO81Vv3RZ_M3bJRsg5Nt_gWLUEVVartRGeRCGyTkBWeFqbmJDoaHxMOzJ35moXMS/exec";

    let appData = { schedule: [], comments: [], likes: {} };
    let currentSelectedDate = '';

    async function loadData() {
      try {
        const response = await fetch(GOOGLE_APP_SCRIPT_URL);
        appData = await response.json();
        
        if (appData.schedule && appData.schedule.length > 0) {
          buildDateNav();
          if (!currentSelectedDate) {
            currentSelectedDate = cleanDateStr(appData.schedule[0].date);
          }
          renderActiveDay();
        }
      } catch (err) {
        console.error("Failed to load application data:", err);
      }
    }

    function cleanDateStr(val) {
      if (!val) return '';
      const s = val.toString().trim();
      return s.includes('T') ? s.split('T')[0] : s;
    }

    function buildDateNav() {
      const navContainer = document.getElementById('date-nav');
      navContainer.innerHTML = '';

      appData.schedule.forEach((entry, index) => {
        const entryDate = cleanDateStr(entry.date);
        const btn = document.createElement('button');
        btn.className = `date-btn ${entryDate === currentSelectedDate ? 'active' : ''}`;
        btn.innerText = entryDate || `Day ${index + 1}`;
        btn.onclick = () => {
          currentSelectedDate = entryDate;
          buildDateNav();
          renderActiveDay();
        };
        navContainer.appendChild(btn);
      });
    }

    function renderActiveDay() {
      const activeEntry = appData.schedule.find(item => cleanDateStr(item.date) === currentSelectedDate) || appData.schedule[0];
      
      document.getElementById('burn-title').innerText = activeEntry.title || 'Untitled Burn';
      document.getElementById('burn-curator').innerText = activeEntry.curator ? `Curated by ${activeEntry.curator}` : '';
      
      const playerContainer = document.getElementById('player-container');
      if (activeEntry.embed) {
        playerContainer.innerHTML = activeEntry.embed;
      } else if (activeEntry.spotify_id) {
        playerContainer.innerHTML = `<iframe src="https://open.spotify.com/embed/playlist/${activeEntry.spotify_id}" allow="encrypted-media"></iframe>`;
      } else {
        playerContainer.innerHTML = `<div style="display:flex;justify-content:center;align-items:center;height:100%;color:#888;">No stream configured</div>`;
      }

      // Render Likes
      const totalLikes = appData.likes[currentSelectedDate] || 0;
      document.getElementById('like-count').innerText = totalLikes;

      // Render Comments
      renderComments();
    }

    function renderComments() {
      const commentList = document.getElementById('comment-list');
      commentList.innerHTML = '';

      const dayComments = appData.comments.filter(c => cleanDateStr(c.date) === currentSelectedDate);

      if (dayComments.length === 0) {
        commentList.innerHTML = `<div style="color: var(--muted-text); font-size: 0.9rem;">No thoughts shared yet. Be the first!</div>`;
        return;
      }

      dayComments.reverse().forEach(c => {
        const item = document.createElement('div');
        item.className = 'comment-item';
        item.innerHTML = `
          <div class="comment-author">${escapeHtml(c.name || 'Anonymous')}</div>
          <div class="comment-body">${escapeHtml(c.comment || '')}</div>
        `;
        commentList.appendChild(item);
      });
    }

    async function submitComment(e) {
      e.preventDefault();

      const nameInput = document.getElementById('comment-name');
      const commentInput = document.getElementById('comment-text');
      const submitBtn = document.getElementById('submit-btn');

      const name = nameInput.value.trim();
      const comment = commentInput.value.trim();

      if (!comment) return;

      submitBtn.disabled = true;
      submitBtn.innerText = 'Verifying...';

      const payload = {
        action: 'addComment',
        date: currentSelectedDate,
        name: name || 'Anonymous',
        comment: comment
      };

      try {
        const response = await fetch(GOOGLE_APP_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === 'success') {
          // Clear inputs on success
          commentInput.value = '';
          nameInput.value = '';
          // Re-fetch clean data from Google Sheets before updating UI
          await loadData();
        } else {
          // Blocked by moderation — do NOT render on screen
          alert('Your comment was flagged by the moderation filter.');
        }
      } catch (err) {
        console.error('Submission error:', err);
        alert('Failed to connect to moderation service. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Post Comment';
      }
    }

    async function submitLike() {
      const likeBtn = document.getElementById('like-button');
      likeBtn.disabled = true;

      const payload = {
        action: 'addLike',
        date: currentSelectedDate
      };

      try {
        const response = await fetch(GOOGLE_APP_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (result.status === 'success') {
          appData.likes[currentSelectedDate] = (appData.likes[currentSelectedDate] || 0) + 1;
          document.getElementById('like-count').innerText = appData.likes[currentSelectedDate];
        }
      } catch (err) {
        console.error('Like error:', err);
      } finally {
        likeBtn.disabled = false;
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Initialize application
    loadData();
  </script>
</body>
</html>
